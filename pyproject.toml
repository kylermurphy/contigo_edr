[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contigo"
version = "0.2.0"
description = "Energy Dissipation Rate and Effective Density Framework for Orbiting Spacecraft"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Kyle Murphy", email = "kylemurphy.spacephys@gmail.com" }
]

keywords = [
    "density",
    "neutral density",
    "thermospheric density",
    "space weather",
    "space physics",
    "thermosphere",
    "energy dissipation",
    "satellite dynamics",
    "orbital dynamics"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=2.0",
    "tables>=3.8",
    "numba>=0.57",
    "tqdm",
    "requests",
    "platformdirs>=3",
    "pyshtools",
    "spiceypy>=8.0.2",
    "orekit-jpype[jdk4py]>=13.1.4",
    "jpype1>=1.4",
    "jdk4py>=25.0"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

test = [
    "pytest>=8",
    "pytest-cov",
]

dev = [
    "contigo[test]",
    "black",
    "ruff",
    "mypy",
    "ipykernel"
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[tool.setuptools.packages.find]
include = ["contigo*"]

[tool.setuptools.package-data]
contigo = [
    "data/*.tls",
    "data/*.bpc",
    "data/*.tpc",
    "data/*.bsp",
    "data/*.hdf",
    "data/EIGEN-2.gfc",
    "java/*.jar",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501: black handles line length. E741: `l` is the standard symbol for the
# spherical-harmonic degree. B008: the defaults flagged (pd.Timedelta, small
# np.array) are never mutated.
ignore = ["E501", "E741", "B008"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "network: needs internet access (NAIF, ICGEM, GitLab); run with --run-network",
    "orekit: starts the Orekit JVM; run with --run-orekit",
    "slow: takes more than ~10 s; run with --run-slow",
]